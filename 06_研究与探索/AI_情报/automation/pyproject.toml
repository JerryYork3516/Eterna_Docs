[project]
name = "eterna-ai-intelligence"
version = "0.1.0"
description = "Eterna AI intelligence automation foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
    "feedparser==6.0.14",
    "google-api-python-client==2.198.0",
    "google-auth==2.56.3",
    "google-auth-httplib2==0.4.1",
    "google-auth-oauthlib==1.4.0",
    "httpx==0.28.1",
    "openai==2.54.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-q",
]
pythonpath = ["."]
testpaths = ["tests"]
